[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "communityott-analytics-service"
version = "1.0.0"
description = "CommunityOTT Python Analytics Service Foundation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CommunityOTT Engineering Team" }
]
dependencies = [
    "fastapi>=0.111.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.35.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<0.29.0",
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
