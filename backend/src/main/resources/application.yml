# ===================================================================
# CommunityOTT Spring Boot Monolith Application Configuration
# Active Profile: local (Development Environment)
# ===================================================================

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    show-sql: false

# Default Security & Auth Configuration (Production safe defaults)
communityott:
  security:
    dev-auth-enabled: false
    otp-secret: ${COMMUNITYOTT_OTP_SECRET:communityott_dev_otp_secret_key_32bytes_min!}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    jwt:
      issuer: ${COMMUNITYOTT_JWT_ISSUER:communityott}
      audience: ${COMMUNITYOTT_JWT_AUDIENCE:communityott-api}
      access-token-ttl-seconds: ${COMMUNITYOTT_JWT_ACCESS_TTL_SECONDS:900}
      secret: ${COMMUNITYOTT_JWT_SECRET:communityott_dev_jwt_hmac_secret_key_minimum_256_bits_for_security!}
  auth:
    delivery:
      mode: ${COMMUNITYOTT_AUTH_DELIVERY_MODE:development}
      email-provider: ${COMMUNITYOTT_AUTH_EMAIL_PROVIDER:development}
      sms-provider: ${COMMUNITYOTT_AUTH_SMS_PROVIDER:development}
      timeout-ms: 5000
    otp:
      length: 6
      ttl-seconds: 300
      max-attempts: 5
      resend-cooldown-seconds: 60
      request-limit-per-hour: 5
  video:
    storage:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:communityott_minio_admin}
      secret-key: ${MINIO_ROOT_PASSWORD:communityott_minio_dev_password}
      bucket-name: ${MINIO_BUCKET_NAME:communityott-videos}
      auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
      max-file-size: ${MINIO_MAX_FILE_SIZE:5368709120}
    processing:
      ffmpeg-path: ${COMMUNITYOTT_FFMPEG_PATH:ffmpeg}
      ffprobe-path: ${COMMUNITYOTT_FFPROBE_PATH:ffprobe}
      timeout-seconds: ${COMMUNITYOTT_VIDEO_PROCESSING_TIMEOUT_SECONDS:120}
      max-concurrent-jobs: ${COMMUNITYOTT_VIDEO_MAX_CONCURRENT_JOBS:2}
      temp-dir: ${COMMUNITYOTT_VIDEO_TEMP_DIR:/tmp/communityott-videos}
      heartbeat-timeout-seconds: ${COMMUNITYOTT_VIDEO_HEARTBEAT_TIMEOUT_SECONDS:300}
  media:
    delivery:
      mode: ${COMMUNITYOTT_MEDIA_DELIVERY_MODE:LOCAL}
      playback-url-ttl-seconds: ${COMMUNITYOTT_PLAYBACK_URL_TTL_SECONDS:900}
      cdn:
        base-url: ${COMMUNITYOTT_CDN_BASE_URL:https://cdn.communityott.com}
        signing-key-id: ${COMMUNITYOTT_CDN_SIGNING_KEY_ID:}
        signing-private-key: ${COMMUNITYOTT_CDN_SIGNING_PRIVATE_KEY:}
        token-auth-enabled: ${COMMUNITYOTT_CDN_TOKEN_AUTH_ENABLED:false}
      rate-limit:
        enabled: ${COMMUNITYOTT_PLAYBACK_RATE_LIMIT_ENABLED:true}
        max-requests-per-minute: ${COMMUNITYOTT_PLAYBACK_MAX_REQUESTS_PER_MINUTE:30}
  playback:
    completion-threshold-percent: ${COMMUNITYOTT_PLAYBACK_COMPLETION_THRESHOLD_PERCENT:95.0}
    session-inactivity-timeout-minutes: ${COMMUNITYOTT_PLAYBACK_INACTIVITY_TIMEOUT_MINUTES:5}
    cleanup-interval-ms: ${COMMUNITYOTT_PLAYBACK_CLEANUP_INTERVAL_MS:60000}
    rate-limit:
      enabled: ${COMMUNITYOTT_PLAYBACK_SESSION_RATE_LIMIT_ENABLED:true}
      max-session-creations-per-minute: ${COMMUNITYOTT_PLAYBACK_MAX_SESSION_CREATIONS_PER_MINUTE:15}
      max-requests-per-minute: ${COMMUNITYOTT_PLAYBACK_MAX_REQUESTS_PER_MINUTE:60}

---
# ===================================================================
# Local Development Profile Configuration
# ===================================================================
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/communityott}
    username: ${SPRING_DATASOURCE_USERNAME:communityott_user}
    password: ${SPRING_DATASOURCE_PASSWORD:communityott_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CommunityOTTHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:communityott_redis_password}
      timeout: 2000ms
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
